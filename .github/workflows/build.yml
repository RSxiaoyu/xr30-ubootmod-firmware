name: Build XR30 Firmware

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ImmortalWrt ref（默认 openwrt-25.12 稳定分支，可填 master 等）'
        required: false
        default: 'openwrt-25.12'
        type: string
  push:
    branches: [main]
    paths: ['config/**', 'files/**', '.github/workflows/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (mediatek/filogic)
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison gawk gettext \
            git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b ${{ inputs.ref || 'openwrt-25.12' }} \
            https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: 缓存依赖源码包
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-${{ hashFiles('config/xr30-seed.config') }}
          restore-keys: dl-

      - name: 更新安装 Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 写入首启默认配置
        run: mkdir -p openwrt/files && cp -r files/. openwrt/files/

      - name: 生成编译配置
        working-directory: openwrt
        run: |
          cp ../config/xr30-seed.config .config
          make defconfig

      - name: 预下载源码包
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          find dl -type f -size -1024c -delete
          make download -j$(nproc)

      - name: 全核编译
        working-directory: openwrt
        run: make -j$(nproc) || make -j1 V=s

      - name: 整理产物
        run: |
          mkdir -p release_firmware
          cp openwrt/bin/targets/mediatek/filogic/*rax3000m* release_firmware/
          sha256sum release_firmware/* > release_firmware/sha256sums.txt
          echo "TAG=$(date -u +%Y.%m.%d-%H%M)-${{ inputs.ref || 'openwrt-25.12' }}" >> "$GITHUB_ENV"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: XR30 · ImmortalWrt ${{ inputs.ref || 'openwrt-25.12' }}
          body: |
            ImmortalWrt `${{ inputs.ref || 'openwrt-25.12' }}` 官方源码 · 设备 `cmcc_rax3000m`（中国移动 XR30 孪生机型）· 官方 U-Boot 布局，零补丁。

            - 内置：HomeProxy（sing-box）· Argon · htop/curl
            - 首启默认：PPE 硬件 NAT 卸载 · BBR · ZRAM(zstd)
            - Wi-Fi 信道 / 频宽 / SSID：开机后在 LuCI 设置
            - 刷机路径与 bootloader 要求见仓库 README（须支持 FIT 多配置引导）
            - 校验：`sha256sums.txt`
          files: release_firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
