name: Build XR30 Modern Firmware

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否发布到 GitHub Releases'
        required: false
        default: 'true'
        type: boolean
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/**'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-24.10
  REPO_BRANCH: openwrt-24.10-6.6
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 初始化编译环境
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison gawk gettext \
            git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          sudo apt-get clean

      - name: 浅层克隆上游源码
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: 依赖下载缓存 (大幅加速编译)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('config/xr30-seed.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-

      - name: 更新与安装 Feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用极简定制脚本与开箱即用配置
        run: |
          chmod +x scripts/custom.sh
          cd openwrt
          ../scripts/custom.sh
          if [ -d ../files ]; then
            mkdir -p files
            cp -rf ../files/* files/
            chmod -R +x files/etc/uci-defaults/ 2>/dev/null || true
          fi

      - name: 合并种子配置生成编译配置
        working-directory: openwrt
        run: |
          cp -f ../config/xr30-seed.config .config
          make defconfig

      - name: 预下载依赖包
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} +

      - name: 全核极速并发编译
        working-directory: openwrt
        run: |
          echo "CPU 核心数: $(nproc)"
          make -j$(nproc) || make -j1 V=s

      - name: 收集与整理固件产物
        id: organize
        run: |
          mkdir -p $GITHUB_WORKSPACE/release_firmware
          cd openwrt/bin/targets/mediatek/filogic
          # 收集核心固件与 sysupgrade 文件
          cp -f *xr30* $GITHUB_WORKSPACE/release_firmware/ 2>/dev/null || cp -f *sysupgrade.bin $GITHUB_WORKSPACE/release_firmware/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/release_firmware
          sha256sum * > sha256sums.txt
          echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV
          echo "STATUS=success" >> $GITHUB_OUTPUT

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: XR30-UbootMod-OpenWrt-${{ env.RELEASE_TAG }}
          path: release_firmware/*

      - name: 自动发布至 GitHub Releases
        if: github.event.inputs.release == 'true' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "XR30 极速现代固件 ${{ env.RELEASE_TAG }}"
          body: |
            ### 🚀 XR30 极客专属固件构建完成
            - **底座架构**：Linux 6.6 (MT7981B / Filogic 820)
            - **无线驱动**：纯粹开源 `kmod-mt76` + WED 硬件加速
            - **网络加速**：PPE 硬件流控全开，跑满千兆 0% CPU 占用
            - **核心组件**：sing-box、ZRAM (zstd) 内存压缩防护、nftables (fw4)
            - **引导要求**：必须在 **UbootMod** (大分区 122.5MB) 下刷入
          files: release_firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
